name: Validar TechLead Hub

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/**

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/techlead_validation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Instalar dependências
        shell: pwsh
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Validar backend e Prisma
        shell: pwsh
        run: |
          npm run prisma:generate --prefix backend
          npm exec --prefix backend -- prisma validate
          npm run build --prefix backend

      - name: Validar frontend
        shell: pwsh
        run: |
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Validar desktop
        shell: pwsh
        run: npm run build:desktop --prefix desktop

  validate-web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: techlead-hub:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
