name: Preparar imagem Web

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem prefixo v (ex.: 1.0.0-rc.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish-web:
    runs-on: ubuntu-latest
    steps:
      - name: Validar versão
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compilar e publicar imagem candidata
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/taysonrv/techlead-hub:${{ inputs.version }}
            ghcr.io/taysonrv/techlead-hub:candidate
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo para infraestrutura
        shell: bash
        run: |
          {
            echo "## Imagem Web preparada"
            echo '```text'
            echo "ghcr.io/taysonrv/techlead-hub:${{ inputs.version }}"
            echo '```'
            echo "Use o digest exibido no passo de build para uma implantação imutável."
            echo "Esta execução não publica nem atualiza o aplicativo Desktop."
          } >> "$GITHUB_STEP_SUMMARY"
