# Banco PostgreSQL gerenciado pela infraestrutura (sem serviço postgres local).
# Iniciar na raiz do repositório:
# docker compose --env-file deploy/.env -f deploy/docker-compose.example.yml config --quiet
# docker compose --env-file deploy/.env -f deploy/docker-compose.example.yml up -d
name: techlead-hub-external-db

services:
  techlead-hub:
    image: ${TECHLEAD_HUB_IMAGE:?Defina TECHLEAD_HUB_IMAGE em deploy/.env}
    container_name: techlead-hub
    restart: "on-failure:3"
    ports:
      - "${TECHLEAD_HUB_PORT:-8080}:3333"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL em deploy/.env (PostgreSQL acessivel pelo container)}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET em deploy/.env}
      SYSTEM_CONFIG_KEY: ${SYSTEM_CONFIG_KEY:?Defina SYSTEM_CONFIG_KEY em deploy/.env}
      APP_RUNTIME: web
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3333"
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      AZURE_SYNC_SCHEDULER_ENABLED: ${AZURE_SYNC_SCHEDULER_ENABLED:-true}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-300000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
