name: techlead-hub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techlead_hub}
      POSTGRES_USER: ${POSTGRES_USER:-techlead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - techlead_postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techlead} -d ${POSTGRES_DB:-techlead_hub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ${TECHLEAD_IMAGE:-ghcr.io/taysonrv/techlead-hub:beta}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-techlead}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-techlead_hub}?schema=public
      MIGRATE_ONLY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  app:
    image: ${TECHLEAD_IMAGE:-ghcr.io/taysonrv/techlead-hub:beta}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_RUNTIME: web
      DATABASE_URL: postgresql://${POSTGRES_USER:-techlead}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-techlead_hub}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      MIGRATE_ON_START: "false"
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-600}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${TECHLEAD_PORT:-3333}:3333"
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  internal:
    driver: bridge

volumes:
  techlead_postgres_data:
